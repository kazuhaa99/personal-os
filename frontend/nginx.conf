server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  # Relative Location headers: behind a TLS-terminating proxy an absolute one would point at http://host:80.
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Path prefix handling, generated at image build from VITE_BASE (empty at the site root).
  include /etc/nginx/pos-base.conf;

  # The client address the API rate-limits sign-ins by. X-Forwarded-For is believed only from the
  # host itself (a reverse proxy on the host reaches this container via loopback or the Docker
  # bridge); anyone else connecting directly can't make up an address. The API gets exactly one.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # The service worker and manifest must be revalidated so app updates reach installed PWAs.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
  location / {
    try_files $uri /index.html;
  }
}
