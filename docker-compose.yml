# Personal OS — local, single-user deployment.
# Only the web UI is published, and only on 127.0.0.1. The API and database are
# reachable solely on the internal compose network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_os
      POSTGRES_USER: personal_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Password of the restricted role the API uses (created by db-init on a fresh volume).
      POS_APP_DB_PASSWORD: ${POS_APP_DB_PASSWORD:?set POS_APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_os -d personal_os"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      # The API runs as a non-superuser so Postgres row-level security applies;
      # migrations (on container start) run as the owner.
      POS_DATABASE_URL: postgresql+psycopg://personal_os_app:${POS_APP_DB_PASSWORD}@db:5432/personal_os
      POS_MIGRATION_DATABASE_URL: postgresql+psycopg://personal_os:${POSTGRES_PASSWORD}@db:5432/personal_os
      POS_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      POS_API_TOKEN: ${POS_API_TOKEN:-}
      POS_AUTH_USERNAME: ${POS_AUTH_USERNAME:-admin}
      POS_AUTH_PASSWORD: ${POS_AUTH_PASSWORD:-}
      POS_SECRET_KEY: ${POS_SECRET_KEY:-}
      POS_SMTP_PASSWORD: ${POS_SMTP_PASSWORD:-}
      POS_ALLOW_REGISTRATION: ${POS_ALLOW_REGISTRATION:-true}
      POS_DEFAULT_TIMEZONE: ${POS_DEFAULT_TIMEZONE:-Asia/Almaty}
      # Keep the session cookie inside the app's path; Secure when served over HTTPS.
      POS_COOKIE_PATH: ${POS_BASE_PATH:-/}
      POS_COOKIE_SECURE: ${POS_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Serve under a path prefix, e.g. /personalos/ (default: the site root).
        VITE_BASE: ${POS_BASE_PATH:-/}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
