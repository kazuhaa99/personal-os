# Personal OS — local, single-user deployment.
# Only the web UI is published, and only on 127.0.0.1. The API and database are
# reachable solely on the internal compose network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_os
      POSTGRES_USER: personal_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_os -d personal_os"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      POS_DATABASE_URL: postgresql+psycopg://personal_os:${POSTGRES_PASSWORD}@db:5432/personal_os
      POS_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      POS_API_TOKEN: ${POS_API_TOKEN:-}
      POS_DEFAULT_TIMEZONE: ${POS_DEFAULT_TIMEZONE:-Asia/Almaty}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
